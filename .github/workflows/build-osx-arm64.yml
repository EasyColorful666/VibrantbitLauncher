# VibrantbitLauncher.Avalonia — osx-arm64 构建工作流
# 触发：push main / push v* tag / 手动触发
# v* tag 推送时，把本架构产物附加到同一个 GitHub Release（首个创建工作流创建 Release，其余追加资产）。
name: Build osx-arm64

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-osx-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: VibrantbitLauncher.Avalonia
  CONFIGURATION: Release
  DOTNET_VERSION: '10.0.x'
  RID: osx-arm64

jobs:
  build:
    name: Build osx-arm64
    runs-on: macos-latest
    permissions:
      contents: write   # 仅 tag 推送时用于上传 Release 资产
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-osx-arm64-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-osx-arm64-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "VibrantbitLauncher.Avalonia.csproj"

      - name: Read version from csproj
        shell: bash
        run: |
          VERSION=$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' "VibrantbitLauncher.Avalonia.csproj" | head -n1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Detected version: $VERSION"

      - name: Publish osx-arm64
        shell: bash
        run: |
          dotnet publish "VibrantbitLauncher.Avalonia.csproj" \
            -c "$CONFIGURATION" \
            -r "$RID" \
            --no-self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o "publish/$RID"

      # macOS 需要打包成 .app 才能真正双击运行（含 Info.plist）
      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SRC="publish/$RID"
          APP="dist/$APP_NAME.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$SRC/$APP_NAME" "$APP/Contents/MacOS/$APP_NAME"
          chmod +x "$APP/Contents/MacOS/$APP_NAME"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>CFBundleName</key>
              <string>VibrantbitLauncher</string>
              <key>CFBundleDisplayName</key>
              <string>VibrantbitLauncher</string>
              <key>CFBundleIdentifier</key>
              <string>com.vibrantbit.launcher</string>
              <key>CFBundleVersion</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleExecutable</key>
              <string>VibrantbitLauncher.Avalonia</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
            </dict>
          </plist>
          PLIST

          tar -czf "dist/$APP_NAME-$RID.tar.gz" -C dist "$APP_NAME.app"

      - name: Package (non-macOS)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/$APP_NAME-$RID.tar.gz" -C "publish/$RID" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.RID }}
          path: dist/${{ env.APP_NAME }}-${{ env.RID }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "$TAG" --generate-notes --latest || true
          gh release upload "$TAG" "dist/$APP_NAME-$RID.tar.gz" --clobber
